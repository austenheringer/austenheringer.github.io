<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VEGA</title>
  <meta name="theme-color" content="#070d0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VEGA">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./vega.css">
</head>
<body>
  <header class="bar">
    <div class="brand">VEGA <span class="sub">personal assistant</span></div>
    <div class="bar-actions">
      <button id="install" class="ghost" title="Install VEGA as an app" hidden>Install</button>
      <button id="newChat" class="ghost" title="Start a new conversation">New</button>
      <button id="openSettings" class="ghost" title="Settings">Settings</button>
    </div>
  </header>

  <main>
    <section class="core-wrap" aria-hidden="true">
      <div id="core" class="core idle">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="nucleus"></div>
      </div>
      <div id="status" class="status">Standing by</div>
    </section>

    <section id="log" class="log" aria-live="polite"></section>

    <form id="composer" class="composer">
      <button type="button" id="mic" class="mic" title="Hold to talk (or press and release)">●</button>
      <input id="input" autocomplete="off" placeholder="Ask VEGA anything…">
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>Settings</h2>
      <label>Anthropic API key
        <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
        <small>Stored only in this browser (localStorage). Anyone with access to this browser profile can read it. Use a key with a spend limit.</small>
      </label>
      <label>Model
        <select id="model">
          <option value="auto">Auto — Sonnet 5.5, asks Opus 5.5 on hard tasks (recommended)</option>
          <option value="claude-opus-5-5">Claude Opus 5.5 (smartest)</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (faster)</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5 (fastest, cheapest)</option>
        </select>
        <small>Changing the model or connectors starts a fresh conversation (your long-term memory is kept).</small>
      </label>
      <label>Effort
        <select id="effort">
          <option value="low">Low — snappy voice replies</option>
          <option value="medium">Medium</option>
          <option value="high">High — harder problems</option>
        </select>
      </label>
      <label>Your name (how VEGA addresses you)
        <input id="userName" placeholder="e.g. Austen">
      </label>
      <label>Location for weather default
        <input id="homeCity" placeholder="e.g. Calgary">
      </label>
      <label class="row"><input id="speak" type="checkbox"> Speak replies aloud</label>
      <label class="row"><input id="wake" type="checkbox"> Always listen for the wake word “Vega” (Chrome/Edge)</label>
      <label>MCP connectors (JSON array) — connects VEGA to Gmail, Notion, GitHub, Zapier, etc.
        <textarea id="mcp" rows="5" placeholder='[{"name":"zapier","url":"https://…/mcp","authorization_token":"…"}]'></textarea>
        <small>Any remote MCP server URL. Anthropic's servers call it on VEGA's behalf. Tokens are stored in this browser.</small>
      </label>
      <div class="settings-actions">
        <button id="clearMemory" type="button" class="ghost danger">Wipe memory</button>
        <button value="save" id="saveSettings">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./vega.js"></script>
</body>
</html>
