# Trading War Room configuration. Validated on startup by warroom.config.AppConfig;
# unknown keys and out-of-range values fail fast. Secrets belong in .env, not here.

app:
  user_title: "Sir"                 # how J.A.R.V.I.S. addresses you
  tickers: [AAPL, NVDA, TSLA, AMD, MSFT]
  macro_tickers: [SPY, QQQ]         # regime / trend bias
  scan_interval_seconds: 15         # orchestrator cycle cadence in --paper (real seconds)
  max_debates_per_cycle: 3          # cap War Room sessions per cycle (best confidence first)
  log_level: INFO

demo:
  # --demo replays the most recent trading session on a sped-up wall clock so it is
  # watchable at any hour (a real-time clock at night/holidays would never see an open market).
  start_time_et: "09:50"
  speed_multiplier: 10              # 10 clock-seconds per real second (~40 min for a full session)
  scan_interval_seconds: 60         # in CLOCK seconds (6 real seconds at 10x)

crypto:
  # 24/7 spot crypto alongside equities. Same paper account and portfolio-wide limits.
  enabled: true
  exchange: kraken                  # fees, lot sizes and minimum orders model Kraken spot
  data_provider: kraken             # kraken (free public data, no keys) | mock. --demo always uses mock.
  symbols: [BTC-USD, ETH-USD, SOL-USD]
  macro_symbol: BTC-USD             # crypto trend bias (the SPY/QQQ of crypto)
  taker_fee_pct: 0.004              # Kraken Pro base tier: 0.40% taker (market orders, stops)
  maker_fee_pct: 0.0025             # 0.25% maker (resting limit targets)
  max_spread_pct: 0.002             # 0.20%
  allow_short: false                # spot accounts cannot short; short setups are vetoed
  max_open_positions: 2             # crypto cap inside the global risk.max_open_positions
  max_hold_minutes: 1440            # no closing bell: a 24h time stop instead of the EOD flat
  timeframe: 15m                    # setups/ATR on 15m (+1h trend). 5m stops are smaller than the fees.
  weekend_risk_multiplier: 0.5      # thinner weekend books: half the risk per trade
  range_lookback_minutes: 720       # rolling 12h range for crypto breakout/breakdown setups
  rvol_lookback_days: 7             # time-of-day volume baseline (Kraken serves ~7.5 days of 15m bars)
  wide_stop_pct: 0.04               # stop farther than 4% of price draws a Risk challenge
  news_feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
  instruments:                      # Kraken defaults; refreshed from Kraken AssetPairs in --paper
    BTC-USD: {qty_step: 0.00000001, min_qty: 0.00005, min_notional: 0.5, price_decimals: 1}
    ETH-USD: {qty_step: 0.00000001, min_qty: 0.002, min_notional: 0.5, price_decimals: 2}
    SOL-USD: {qty_step: 0.00000001, min_qty: 0.02, min_notional: 0.5, price_decimals: 2}

strategies:
  # Which setups the Technical agent looks for. Built-ins: orb_breakout (stocks), range_breakout
  # (crypto), vwap_bounce, ema_pullback, rvol_momentum. Your own rule strategies live in
  # strategies/<name>.yaml (see strategies/README.md) and are switched on by adding their name here
  # - or just tell J.A.R.V.I.S.: "enable my_strategy".
  enabled: [orb_breakout, range_breakout, vwap_bounce, ema_pullback, rvol_momentum]
  rules_dir: strategies
  params: {}                        # e.g. {rvol_momentum: {rvol_multiple: 1.5}}

account:
  starting_equity: 100000.0
  starting_cash: 100000.0

risk:
  max_risk_pct: 0.01                # 1.0% of equity risked per trade
  max_position_pct: 0.25            # max 25% of available cash in one position
  min_reward_risk: 2.0              # measured entry -> TP1 AFTER structural capping (see target_policy)
  # counter-trend (SPY/QQQ against the trade): TP1 must still pay min_reward_risk AND the blended
  # R:R (tp1_scale_out_pct at TP1, rest at TP2) must reach this - i.e. room all the way to TP2.
  counter_trend_min_reward_risk: 2.5
  atr_stop_multiplier: 1.5
  # stop_policy:
  #   structure_within_atr - use the swing low/high (+buffer) unless it is farther than
  #                          atr_stop_multiplier*ATR from entry; then use the ATR stop.
  #   atr_only             - always atr_stop_multiplier*ATR.
  stop_policy: structure_within_atr
  stop_buffer_atr: 0.1              # stop sits this many ATRs beyond the swing level
  min_stop_atr: 0.25                # never tighter than 0.25 ATR (noise would stop it out)
  # target_policy:
  #   structural_cap - targets start at tp*_r_multiple but are pulled in to the nearest
  #                    opposing level (PDH/PDL, premarket H/L, ORB H/L). If that leaves TP1 < min_reward_risk -> VETO.
  #   fixed_r        - pure R multiples (makes the R:R gate a formality; not recommended).
  target_policy: structural_cap
  tp1_r_multiple: 2.0
  tp2_r_multiple: 3.0
  tp1_scale_out_pct: 0.5            # sell 50% at TP1 and move stop to breakeven
  max_daily_loss_pct: 0.03          # halt new entries for the day at -3% of start-of-day equity
  daily_loss_includes_unrealized: true  # open losers count toward the limit, not just closed ones
  consecutive_loss_limit: 3
  consecutive_loss_cooldown_minutes: 30
  max_open_positions: 3
  max_spread_pct: 0.0015            # 0.15%
  unknown_spread_policy: veto       # veto | allow - what to do when the provider has no real bid/ask (yfinance)
  max_data_age_seconds: 120         # stale-data veto (enforced in paper mode)
  enforce_pdt_rule: false
  pdt_equity_threshold: 25000.0
  pdt_max_day_trades: 3             # in a rolling 5-business-day window

technical:
  setup_cooldown_minutes: 15        # per (ticker, direction) de-dup gate
  ema_periods: [9, 21, 50]
  rsi_period: 14
  atr_period: 14
  rvol_lookback_days: 10
  rvol_threshold: 1.5
  orb_minutes: 15
  swing_lookback_bars: 10           # 5m bars used for the structural swing high/low
  history_days: 12                  # calendar days of 5m history fetched (EMA50 warm-up, RVOL, prior day)
  vwap_touch_pct: 0.0015            # "touched VWAP" tolerance (0.15%)
  min_confidence_to_trade: 0.55     # below this an approved setup goes to WATCHLIST, not execution
  no_new_entries_after_et: "15:30"

news:
  blackout_minutes_before: 15
  blackout_minutes_after: 15
  conflict_sentiment_threshold: 0.3 # |sentiment| beyond this against direction = conflict
  halt_feed_enabled: true           # Nasdaq Trader halt RSS (paper mode)
  macro_cache_path: data/macro_cache.json
  macro_refresh_days: 7             # re-fetch Fed FOMC + BLS schedules weekly

execution:
  slippage_pct: 0.0005              # 0.05%
  commission_per_share: 0.0
  commission_min: 0.0
  short_margin_requirement: 1.5     # Reg-T style: reserve 150% of short notional
  eod_flat_minutes_before_close: 5  # 15:55 ET normal day, 12:55 ET early close
  live_trading_enabled: false       # real-money execution is not implemented (docs/LIVE_TRADING_PLAN.md)

providers:
  market_data: mock                 # mock | yfinance | alpaca
  news: mock                        # mock | rss | alpaca | finnhub
  llm: rule_based                   # rule_based | anthropic | openai
  anthropic_model: claude-sonnet-5-5
  openai_model: gpt-4o-mini
  llm_timeout_seconds: 20
  max_daily_llm_calls: 200
  alpaca_feed: iex                  # iex (free) | sip (paid, consolidated NBBO)
  rss_feeds:
    - https://feeds.content.dowjones.io/public/rss/mw_topstories
  mock_seed: 42

http:
  timeout_seconds: 10
  max_retries: 4
  backoff_base_seconds: 0.5
  backoff_max_seconds: 30

voice:
  edge_voice: en-GB-RyanNeural
  rate: "+0%"
  max_queue: 10

storage:
  # {mode} is replaced by demo/paper/replay/smoke so demo trades can never pollute
  # paper-mode circuit breakers (daily loss, loss streak, PDT count).
  db_path: data/trades_{mode}.db

replay:
  # Free sources do not serve old 1m bars (yfinance keeps ~30 days). Drop CSVs here as
  # <data_dir>/<YYYY-MM-DD>/<TICKER>.csv (timestamp,open,high,low,close,volume; UTC) to replay any date.
  source: auto                      # auto (csv -> alpaca -> yfinance -> fail) | csv | alpaca | yfinance | mock
  data_dir: data/history
  starting_equity: 100000.0
  assumed_spread_pct: 0.0005        # historical bid/ask is unavailable: quotes are synthesised from bar closes
  scan_every_minutes: 1             # War Room scan cadence in replay (clock minutes)

notifications:
  discord_enabled: false
  telegram_enabled: false
  notify_on: [APPROVED, TRADE_EXECUTED, CIRCUIT_BREAKER]

calendar:
  extra_holidays: []                # ad-hoc closures, e.g. ["2025-01-09"]
  extra_early_closes: []
