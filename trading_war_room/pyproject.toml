[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-war-room"
version = "0.1.0"
description = "Multi-agent day-trading analysis, risk management and PAPER trading with an Agent War Room and a J.A.R.V.I.S.-style console. Advisory/paper only - no live order execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "textual>=0.60",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
yfinance = ["yfinance>=0.2.40"]
news = ["feedparser>=6.0"]
llm = ["anthropic>=0.40", "openai>=1.40"]
voice = ["edge-tts>=6.1", "pygame>=2.5", "pyttsx3>=2.90"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = [
    "trading-war-room[alpaca,yfinance,news,llm,voice,dev]",
]

[tool.setuptools.packages.find]
include = ["warroom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]
